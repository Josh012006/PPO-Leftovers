[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-exploitation-gap"
version = "0.1.0"
description = "Studying PPO's exploitation gap on a fixed dataset, motivated by Berseth (2025)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
