# Standard online PPO used ONLY to produce the frozen checkpoint that D is
# collected from. Training stops once eval success_rate >= target_success_rate
# is maintained for `success_streak_length` consecutive eval checks (not on
# the first crossing -- a single lucky eval batch isn't evidence of a
# stable policy), or total_iterations is reached, whichever first. The
# checkpoint actually saved is the EARLIEST one in that streak.
total_iterations: 500
rollout_steps: 4096   # total env steps collected per iteration, across all n_envs
n_envs: 8
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
epochs: 10
minibatch_size: 256
lr: 0.0003
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
hidden_sizes: [64, 64]
target_success_rate: 0.35
success_streak_length: 5   # consecutive eval checks required at/above target
eval_episodes: 500         # note: raising this meaningfully slows each eval check
eval_every: 5
seed: 0