# New best configuration (k=0.30, replacing k=0.10) -- see README,
# "A more rigorous sweep of the two new hyperparameters: beta and k".
# Confirmed by the full beta x k cross-sweep: beta=0.9995 remains the
# right anchor, k=0.30 beats the previously-reported k=0.10
# (mean=0.4357 vs. 0.4289).

clip_eps: 0.55
gae_lambda: 0.90
entropy_coef: 0.0
value_coef: 1.0
max_grad_norm: 0.1
epochs: 300
minibatch_size: 256
lr: 0.0003
hidden_sizes: [64, 64]
seed: 0

use_effective_sample_weighting: true
effective_sample_beta: 0.9995
effective_sample_kl_anchor: true
effective_sample_kl_k: 0.30
