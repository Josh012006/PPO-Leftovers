# H3 continuation: does performance keep improving past 0.4 (the best
# value found in the 0.1-0.4 sweep), or does 0.4 sit near a real peak?
# Same as ppo_fixed_d_h3_clip_sweep.yaml (300 epochs, identical other
# hyperparameters, seed=0) but testing wider values around and beyond 0.4.

epochs: 300
minibatch_size: 256

clip_eps: [0.35, 0.45, 0.5, 0.55, 0.6]
gamma: 0.99
gae_lambda: 0.95
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
normalize_advantages: true

lr: 0.0003
hidden_sizes: [64, 64]

seed: 0
