# Deliberately overfit-prone fixed-D PPO config, used ONLY by
# scripts/verify_overfitting_detectable.py's positive control (README,
# "Phase 2", requirement 3): if overfitting is detectable at all, THIS
# config -- pushed hard toward memorizing whatever D emphasizes -- should
# show it most clearly, as a large covered-vs-held-out success_rate gap.
# This is NOT a candidate "best configuration" like
# configs/phase2/ppo_fixed_d_standard.yaml -- it exists purely to
# generate a positive control signal.

epochs: 300           # far more than phase 1's baseline -- more repeated
                       # gradient passes over D's same skewed coverage
minibatch_size: 256

clip_eps: 0.3
gamma: 0.99
gae_lambda: 0.95
entropy_coef: 0.0     # no exploration pressure pushing back against
                       # committing hard to whatever D shows most
value_coef: 0.5
max_grad_norm: 0.5
normalize_advantages: true

lr: 0.0003
hidden_sizes: [64, 64]

seed: 0
