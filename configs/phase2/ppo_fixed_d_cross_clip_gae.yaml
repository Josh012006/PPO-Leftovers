# Cross-sweep 1/3: clip_eps x gae_lambda. Motivated directly by the
# mechanism already documented (README, H3): the clip_eps=[0.2,0.25]
# collapse was driven by how far theta could drift before the advantage
# estimate pushed it past a close decision boundary -- gae_lambda governs
# how reliable that advantage estimate is in the first place (lambda->0
# leans on pi_beta's own, possibly-stale critic; lambda->1 uses the real
# observed trajectory return). A 3x3 grid around this project's
# independently-found optima (clip_eps=0.4, gae_lambda=0.95) checks
# whether the true joint optimum sits somewhere neither individual sweep
# could have found. entropy_coef=0.0 fixed (H5).

epochs: 300
minibatch_size: 256

clip_eps: [0.3, 0.4, 0.5]
gamma: 0.99
gae_lambda: [0.90, 0.95, 1.0]
entropy_coef: 0.0
value_coef: 0.5
max_grad_norm: 0.5
normalize_advantages: true

lr: 0.0003
hidden_sizes: [64, 64]

seed: 0
