# H4 ablation: probing epochs far beyond any realistic range (standard PPO
# uses K=3 for discrete/Atari-style environments, K=10 for continuous
# control -- see Schulman et al. 2017). Every field here is identical to
# ppo_fixed_d_standard.yaml EXCEPT epochs, which is pushed to 300 (30-100x
# the conventional range) specifically to find out whether epochs alone
# stops mattering somewhere in that range, or whether the earlier flat
# clip_frac/entropy pattern at 10 vs 30 was just an early-training
# artifact. Used by scripts/analyze_epochs.py, not scripts/04.

epochs: 300
minibatch_size: 256

# --- PPO objective (unchanged from standard) ---
clip_eps: 0.1
gamma: 0.99
gae_lambda: 0.95
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5
normalize_advantages: true

# --- optimization (unchanged from standard) ---
lr: 0.0003
hidden_sizes: [64, 64]

seed: 0