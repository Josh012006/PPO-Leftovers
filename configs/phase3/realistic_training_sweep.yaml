# Full, from-scratch, multi-window PPO training -- not this project's
# fixed-D single-window protocol. Random initialization, no prior
# checkpoint; each window collects its own fresh rollout under the
# current policy, trains for epochs_per_window gradient epochs, and
# carries the result forward as the start of the next window.
#
# Multi-seed, longer-budget follow-up to a first 1-seed, 50-window run:
# that run found lr=0.0003 too slow to show any learning in this budget
# (dropped here), and a ranking between modes that REVERSED between
# lr=0.001 (none finished highest) and lr=0.002 (kl_anchored finished
# highest) -- this run (5 seeds, num_windows raised 50 -> 200) is what
# tells a genuine failure mode of the weighting mechanism apart from one
# seed's own unlucky trajectory.
#
# Budget per run: 200 windows x 100 episodes collected x 30 gradient
# epochs = 20,000 episodes collected, 6,000 cumulative gradient epochs,
# evaluated every 5 windows (40 evaluation points per run).

episodes_per_window: 100
num_windows: 200
epochs_per_window: 30
eval_every_windows: 5

minibatch_size: 256
clip_eps: 0.55
gae_lambda: 0.90
hidden_sizes: [64, 64]

bandwidth_state: 1.0e-6   # "constant" and "kl_anchored" modes
bandwidth_action: 1.0e-6
kernel: gaussian

beta: 0.9995     # "constant" and "kl_anchored" modes
kl_k: 0.10       # "kl_anchored" mode only

eval_episodes: 500
# Deliberately a NEW seed, distinct from 999 (used everywhere else in this
# project, always for the old fixed-D, tiered-coverage evaluation this
# experiment does not use) -- marks this from-scratch multi-window track
# as its own thing, not directly numerically comparable epoch-for-epoch
# to earlier results.
eval_seed: 424242

modes:
  - none
  - constant
  - kl_anchored

# lr=0.0003 dropped: the first, 1-seed/50-window run already established
# it as too slow to show any learning at all in this budget.
learning_rates:
  - 0.001
  - 0.002

success_rate_thresholds:
  - 0.35
  - 0.40
  - 0.42
