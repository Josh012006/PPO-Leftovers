name: tests

# Runs the test suite (Tier-1 unit/pipeline-bug tests in tests/*.py, plus
# the Tier-0 cross-environment validation in tests/tier0/) on every push and
# pull request. Does NOT run scripts/run_pipeline.sh -- the actual 30x30
# research pipeline is a long, compute-heavy experiment, not a CI check.
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: pip install --upgrade pip

      # Installed separately, from the CPU-only wheel index, so CI doesn't
      # pull torch's much larger CUDA build -- no GPU is available on the
      # runner anyway. requirements.txt's generic `torch>=2.1` is then
      # already satisfied and pip will skip reinstalling it.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: pip install -r requirements.txt

      - name: Install package (editable)
        run: pip install -e .

      - name: Run test suite
        run: pytest tests/ -v